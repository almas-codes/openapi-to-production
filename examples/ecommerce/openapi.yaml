openapi: 3.0.3
info:
  title: Acme Commerce API
  version: 2.1.0
  description: High-scale eCommerce API with JWT authentication, file uploads, polymorphic discounts, and pagination.
servers:
  - url: https://api.commerce.acme.com/v1
paths:
  /auth/login:
    post:
      summary: Authenticate user and receive JWT
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '401':
          description: Invalid credentials
  /products:
    get:
      summary: Query paginated catalog products
      operationId: listProducts
      tags:
        - Products
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'
    post:
      summary: Create new catalog product
      operationId: createProduct
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /products/{productId}/image:
    post:
      summary: Upload product hero image
      operationId: uploadProductImage
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageUrl:
                    type: string
  /orders:
    post:
      summary: Place an order
      operationId: placeOrder
      tags:
        - Orders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPlacement'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    AuthToken:
      type: object
      required:
        - accessToken
        - expiresIn
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
    Product:
      type: object
      required:
        - id
        - sku
        - name
        - price
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          pattern: '^[A-Z0-9-]{6,12}$'
        name:
          type: string
          minLength: 2
          maxLength: 120
        price:
          type: number
          minimum: 0
        discount:
          $ref: '#/components/schemas/Discount'
    CreateProductRequest:
      type: object
      required:
        - sku
        - name
        - price
      properties:
        sku:
          type: string
        name:
          type: string
        price:
          type: number
    PaginatedProducts:
      type: object
      required:
        - total
        - page
        - items
      properties:
        total:
          type: integer
        page:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    Discount:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - Percentage
            - FixedAmount
        value:
          type: number
          minimum: 0
    OrderPlacement:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    Order:
      type: object
      required:
        - id
        - totalAmount
        - status
      properties:
        id:
          type: string
          format: uuid
        totalAmount:
          type: number
        status:
          type: string
          enum:
            - Created
            - Paid
            - Shipped
            - Cancelled
