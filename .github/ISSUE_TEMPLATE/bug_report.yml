name: Bug Report
description: Create a report to help us improve o2p
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: input
    id: version
    attributes:
      label: o2p Version
      description: What version of @o2p/cli or generator are you using?
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: OpenAPI Spec Snippet
      description: Please share the relevant snippet of your openapi.yaml
      placeholder: |
        openapi: 3.0.3
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
